[package]
name = "wishlez"
version = "0.1.0"
description = "Wishlez - A Personal Finance Management Application"
authors = ["Gopikirshna Sathyamurthy"]
edition = "2024"

[lib]
name = "wishlez_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v7"] }
ts-rs = "12.0.1"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
